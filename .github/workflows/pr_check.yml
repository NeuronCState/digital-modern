name: PR Check and Auto Merge

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run tests
      run: PYTHONPATH=mcp python3 -m unittest discover -s mcp

    - name: Auto-merge PR if no conflicts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge ${{ github.event.pull_request.number }} --auto --merge
